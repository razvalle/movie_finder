<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#081a2b" />
  <title>Movie Finder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="toolbar" aria-label="Movie display controls">
    <label class="sr-only" for="result-sort">Sort movies</label>
    <select id="result-sort" aria-label="Sort movies">
      <option value="match">Best match</option>
      <option value="popular">Most popular</option>
      <option value="rating">Highest rated</option>
      <option value="newest">Newest</option>
    </select>
    <div class="view-toggle" role="group" aria-label="Movie layout">
      <button type="button" data-view-mode="grid" aria-label="Grid view" aria-pressed="true" title="Grid view">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 1h6v6H1zM9 1h6v6H9zM1 9h6v6H1zM9 9h6v6H9z"/></svg>
      </button>
      <button type="button" data-view-mode="list" aria-label="List view" aria-pressed="false" title="List view">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3h10M5 8h10M5 13h10"/><circle cx="2" cy="3" r=".75"/><circle cx="2" cy="8" r=".75"/><circle cx="2" cy="13" r=".75"/></svg>
      </button>
    </div>
  </main>
  <script src="{{ url_for('static', filename='js/minimal-controls.js') }}" defer></script>
</body>
</html>
